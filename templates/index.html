<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Quiz &mdash; Online Quiz Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --white: #ffffff;
    --sky: #4aa3d8;
    --sky-dark: #2c7dad;
    --sky-light: #eaf6fc;
    --sky-border: #cfe8f4;
    --orange: #f39c4e;
    --orange-dark: #dd7f2c;
    --orange-light: #fff2e2;
    --orange-border: #fbdcb2;
    --ink: #26313d;
    --ink-soft: #5b6b78;
    --danger: #d76a5a;
    --danger-light: #fbe8e5;
    --border: #e1ecf1;
    --page-bg: var(--sky-light);
    --surface: var(--white);
    --radius: 10px;
    --shadow: 0 2px 10px rgba(38, 49, 61, 0.06);
    --transition-theme: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  /* ---------- Dark mode overrides ---------- */
  html[data-theme="dark"] {
    --white: #1e2530;
    --sky: #4aa3d8;
    --sky-dark: #7ec4ea;
    --sky-light: #223142;
    --sky-border: #2d4054;
    --orange: #f39c4e;
    --orange-dark: #ffb066;
    --orange-light: #3a2c1e;
    --orange-border: #55402a;
    --ink: #eef2f5;
    --ink-soft: #a9b6c1;
    --danger: #e07e6f;
    --danger-light: #3d2621;
    --border: #333f4d;
    --page-bg: #151b23;
    --surface: #1e2530;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  html { transition: var(--transition-theme); }

  body {
    font-family: 'Inter', Arial, sans-serif;
    background-color: var(--page-bg);
    margin: 0;
    padding: 0;
    color: var(--ink);
    line-height: 1.5;
    transition: var(--transition-theme);
  }

  h1, h2, h3 {
    font-family: 'Poppins', 'Inter', sans-serif;
    color: var(--ink);
    margin: 0 0 6px 0;
  }

  h1 { font-size: 22px; font-weight: 600; }
  h3 { font-size: 16px; font-weight: 600; }

  p { color: var(--ink-soft); margin: 0 0 12px 0; font-size: 14px; }

  a { color: var(--sky-dark); cursor: pointer; }

  /* ---------- Top navigation bar ---------- */
  #navbar {
    background-color: var(--white);
    padding: 14px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
    flex-wrap: wrap;
    gap: 10px;
  }
  #navbar .title {
    font-family: 'Poppins', sans-serif;
    font-size: 19px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.2px;
  }
  #navbar .title::before {
    content: "";
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--orange);
    margin-right: 9px;
  }
  #navbar > div {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }
  #navbar a {
    padding: 7px 12px;
    text-decoration: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    border-radius: 6px;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  #navbar a:hover {
    background-color: var(--sky-light);
    color: var(--sky-dark);
  }
  #navbar a.btn {
    color: var(--white);
  }

  /* ---------- Flash messages ---------- */
  #flash {
    max-width: 960px;
    margin: 16px auto 0 auto;
    padding: 0 20px;
  }
  .msg {
    padding: 11px 14px;
    margin-bottom: 8px;
    border-radius: var(--radius);
    font-size: 13.5px;
    font-weight: 500;
    border: 1px solid transparent;
  }
  .msg-success { background: var(--sky-light); color: var(--sky-dark); border-color: var(--sky-border); }
  .msg-danger  { background: var(--danger-light); color: #a8392a; border-color: #f3c7bf; }
  .msg-warning { background: var(--orange-light); color: var(--orange-dark); border-color: var(--orange-border); }
  .msg-info    { background: var(--sky-light); color: var(--sky-dark); border-color: var(--sky-border); }

  /* ---------- Main content area ---------- */
  .box {
    max-width: 960px;
    margin: 24px auto;
    background: var(--white);
    padding: 28px 30px;
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }

  /* ---------- Grid for quiz cards ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 16px;
  }
  .quiz-box {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    background: var(--white);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .quiz-box:hover {
    border-color: var(--sky-border);
    box-shadow: var(--shadow);
  }

  /* ---------- Buttons ---------- */
  button, .btn {
    padding: 9px 16px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    margin-right: 6px;
    margin-top: 6px;
    display: inline-block;
    text-decoration: none;
    transition: filter 0.15s ease, transform 0.05s ease;
  }
  button:hover, .btn:hover { filter: brightness(0.95); }
  button:active, .btn:active { transform: translateY(1px); }
  button:focus-visible, .btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--sky-dark);
    outline-offset: 2px;
  }

  .btn-blue  { background-color: var(--sky); color: var(--white); }
  .btn-green { background-color: var(--orange); color: var(--white); }
  .btn-red   { background-color: var(--danger); color: var(--white); }
  .btn-gray  { background-color: var(--white); color: var(--ink-soft); border: 1px solid var(--border); }

  /* ---------- Forms ---------- */
  input[type=text], input[type=password], input[type=number], input[type=file], textarea, select {
    width: 100%;
    padding: 10px 12px;
    margin-top: 6px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    background: var(--white);
    color: var(--ink);
    box-sizing: border-box;
    transition: border-color 0.15s ease;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--sky);
  }
  label {
    font-weight: 600;
    font-size: 13.5px;
    color: var(--ink);
  }

  /* ---------- Tables ---------- */
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    font-size: 14px;
  }
  th, td {
    border-bottom: 1px solid var(--border);
    padding: 10px 12px;
    text-align: left;
  }
  th {
    background-color: var(--sky-light);
    color: var(--sky-dark);
    font-weight: 600;
    font-size: 12.5px;
    text-transform: none;
  }
  tr.highlight {
    background-color: var(--orange-light);
  }
  tr:hover td { background-color: #f8fbfd; }
  tr.highlight:hover td { background-color: var(--orange-light); }

  /* ---------- Status / role tags ---------- */
  .tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--white);
  }
  .tag-admin      { background: var(--ink); }
  .tag-instructor { background: var(--orange-dark); }
  .tag-student    { background: var(--sky-dark); }
  .tag-pending    { background: var(--orange); }
  .tag-approved   { background: var(--sky); }
  .tag-rejected   { background: var(--danger); }

  /* ---------- Question box on take-quiz page ---------- */
  .question {
    border: 1px solid var(--border);
    padding: 16px 18px;
    margin-bottom: 12px;
    border-radius: var(--radius);
    background: var(--white);
  }
  .question b { color: var(--sky-dark); }
  .option {
    padding: 6px 0;
    font-size: 14px;
  }
  .option label { font-weight: 400; cursor: pointer; }

  .timer {
    background: var(--orange-light);
    color: var(--orange-dark);
    padding: 12px 14px;
    border: 1px solid var(--orange-border);
    border-radius: var(--radius);
    margin-bottom: 16px;
    font-size: 15px;
    font-weight: 600;
  }

  .square-box {
    width: 420px;
    height: 420px;
    max-width: 90vw;
    max-height: 90vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .page-center {
    min-height: calc(100vh - 90px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .center { text-align: center; }

  #navbar, .box, .quiz-box, .question, table, th, td, input, textarea, select,
  .msg, .tag, .timer, .score-box {
    transition: var(--transition-theme);
  }

  /* ---------- Theme toggle button ---------- */
  #themeToggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--sky-light);
    color: var(--ink);
    cursor: pointer;
    margin: 0;
  }
  #themeToggle:hover { filter: brightness(0.96); }
  #themeToggle .icon { font-size: 16px; line-height: 1; }

  .score-box {
    font-family: 'Poppins', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--sky-dark);
    border: 6px solid var(--sky-light);
    border-top-color: var(--orange);
    border-radius: 50%;
    width: 120px;
    height: 120px;
    line-height: 108px;
    margin: 20px auto;
  }
</style>
</head>
<body>

<div id="navbar"></div>
<div id="flash"></div>
<div id="app"></div>

<script>

// ---------- global state ----------
var currentUser = null;

// ---------- helper: call the API ----------
function callApi(method, url, body, isFile) {
  var options = { method: method, credentials: 'same-origin', headers: {} };
  if (body) {
    if (isFile) {
      options.body = body;
    } else {
      options.headers['Content-Type'] = 'application/json';
      options.body = JSON.stringify(body);
    }
  }
  return fetch(url, options).then(function (res) {
    return res.json().catch(function () { return {}; }).then(function (data) {
      if (!res.ok) {
        showMessage(data.error || 'Something went wrong', 'danger');
        throw new Error(data.error || 'error');
      }
      return data;
    });
  });
}

// ---------- helper: show a flash message ----------
function showMessage(text, type) {
  var flash = document.getElementById('flash');
  var div = document.createElement('div');
  div.className = 'msg msg-' + type;
  div.textContent = text;
  flash.appendChild(div);
  setTimeout(function () { div.remove(); }, 4000);
}

// ---------- helper: escape text so it's safe to put in HTML ----------
function esc(text) {
  if (text === null || text === undefined) return '';
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ---------- go to a different "page" ----------
function goTo(hash) {
  window.location.hash = hash;
}

// ---------- set the content of the main app div ----------
function setContent(html) {
  document.getElementById('app').innerHTML = html;
}

// ---------- draw the top navbar based on who is logged in ----------
function drawNavbar() {
  var nav = document.getElementById('navbar');
  var linksHtml = '';

  if (currentUser) {
    if (currentUser.role === 'admin') {
      linksHtml += '<a onclick="goTo(\'#/admin\')">Dashboard</a>';
      linksHtml += '<a onclick="goTo(\'#/admin/instructors\')">Instructors</a>';
      linksHtml += '<a onclick="goTo(\'#/admin/quizzes\')">Quizzes</a>';
      linksHtml += '<a onclick="goTo(\'#/admin/results\')">Results</a>';
    } else if (currentUser.role === 'instructor') {
      if (currentUser.status === 'approved') {
        linksHtml += '<a onclick="goTo(\'#/instructor\')">My Quizzes</a>';
        linksHtml += '<a onclick="goTo(\'#/instructor/new\')">New Quiz</a>';
      }
    } else {
      linksHtml += '<a onclick="goTo(\'#/student\')">Quizzes</a>';
      linksHtml += '<a onclick="goTo(\'#/student/results\')">My Results</a>';
    }
    linksHtml += '<span class="tag tag-' + currentUser.role + '">' + currentUser.role + '</span> ';
    if (currentUser.role === 'instructor') {
      linksHtml += '<span class="tag tag-' + currentUser.status + '">' + currentUser.status + '</span> ';
    }
    linksHtml += '<b>' + esc(currentUser.username) + '</b> ';
    linksHtml += '<a onclick="logout()">Logout</a>';
  } else {
    linksHtml += '<a onclick="goTo(\'#/login\')">Login</a>';
    linksHtml += '<a class="btn btn-blue" onclick="goTo(\'#/register\')">Sign Up</a>';
  }

  linksHtml += '<button id="themeToggle" onclick="toggleTheme()" aria-label="Toggle dark mode"></button>';

  nav.innerHTML = '<span class="title">E-Quiz</span><div>' + linksHtml + '</div>';
  updateThemeToggleLabel();
}

// ---------- dark mode / light mode ----------
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem('equiz-theme', theme); } catch (e) {}
  updateThemeToggleLabel();
}

function toggleTheme() {
  var current = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(current === 'dark' ? 'light' : 'dark');
}

function updateThemeToggleLabel() {
  var btn = document.getElementById('themeToggle');
  if (!btn) return;
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  btn.innerHTML = isDark ? '<span class="icon">&#9728;</span>' : '<span class="icon">&#9790;</span>';
}

(function initTheme() {
  var saved = null;
  try { saved = localStorage.getItem('equiz-theme'); } catch (e) {}
  if (!saved) {
    saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', saved);
})();

function logout() {
  callApi('POST', '/api/logout').then(function () {
    currentUser = null;
    drawNavbar();
    goTo('#/');
  });
}

// ---------- ROUTER ----------
// Looks at the URL hash and decides what to show
window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', function () {
  callApi('GET', '/api/me').then(function (data) {
    currentUser = data.user;
  }).catch(function () {
    currentUser = null;
  }).then(function () {
    drawNavbar();
    router();
  });
});

function router() {
  var hash = window.location.hash || '#/';

  // block pages that need login
  var needsLogin = hash.indexOf('#/admin') === 0 || hash.indexOf('#/instructor') === 0 || hash.indexOf('#/student') === 0;
  if (needsLogin && !currentUser) {
    goTo('#/login');
    return;
  }

  if (hash === '#/' || hash === '') {
    if (currentUser) {
      if (currentUser.role === 'admin') return goTo('#/admin');
      if (currentUser.role === 'instructor') return goTo(currentUser.status === 'approved' ? '#/instructor' : '#/instructor/pending');
      return goTo('#/student');
    }
    return showHomePage();
  }

  if (hash === '#/login') return showLoginPage();
  if (hash === '#/register') return showRegisterPage();

  if (hash === '#/admin') return showAdminDashboard();
  if (hash === '#/admin/instructors') return showAdminInstructors();
  if (hash === '#/admin/quizzes') return showAdminQuizzes();
  if (hash === '#/admin/results') return showAdminResults();

  if (hash === '#/instructor/pending') return showPendingPage();
  if (hash === '#/instructor') {
    if (currentUser.status !== 'approved') return goTo('#/instructor/pending');
    return showInstructorDashboard();
  }
  if (hash === '#/instructor/new') return showQuizForm(null);

  var match;
  if ((match = hash.match(/^#\/instructor\/edit\/(\d+)$/))) return showQuizForm(match[1]);
  if ((match = hash.match(/^#\/instructor\/questions\/(\d+)$/))) return showQuestionsPage(match[1]);
  if ((match = hash.match(/^#\/instructor\/addquestion\/(\d+)$/))) return showAddQuestionPage(match[1]);
  if ((match = hash.match(/^#\/instructor\/upload\/(\d+)$/))) return showUploadPage(match[1]);
  if ((match = hash.match(/^#\/instructor\/leaderboard\/(\d+)$/))) return showLeaderboard(match[1], '/api/instructor/quizzes/' + match[1] + '/leaderboard');

  if (hash === '#/student') return showStudentDashboard();
  if (hash === '#/student/results') return showMyResults();
  if ((match = hash.match(/^#\/student\/take\/(\d+)$/))) return showTakeQuizPage(match[1]);
  if ((match = hash.match(/^#\/leaderboard\/(\d+)$/))) return showLeaderboard(match[1], '/api/quizzes/' + match[1] + '/leaderboard');

  setContent('<div class="box"><p>Page not found.</p></div>');
}

// ===================================================
// HOME / LOGIN / REGISTER
// ===================================================

function showHomePage() {
  setContent(
    '<div class="page-center">' +
    '<div class="box square-box center">' +
    '<h1>Welcome to the Quiz Management System</h1>' +
    '<p>Admins approve instructors, instructors create quizzes, and students take them and see their rank.</p>' +
    '<a class="btn btn-blue" onclick="goTo(\'#/register\')">Sign Up</a>' +
    '<a class="btn btn-gray" onclick="goTo(\'#/login\')">Login</a>' +
    '</div>' +
    '</div>'
  );
}

function showLoginPage() {
  setContent(
    '<div class="box" style="max-width:400px;">' +
    '<h1>Login</h1>' +
    '<form id="loginForm">' +
    '<label>Username</label>' +
    '<input type="text" id="loginUsername" required>' +
    '<label>Password</label>' +
    '<input type="password" id="loginPassword" required>' +
    '<button type="submit" class="btn btn-blue">Login</button>' +
    '</form>' +
    '<p>No account? <a onclick="goTo(\'#/register\')">Sign up here</a></p>' +
    '</div>'
  );

  document.getElementById('loginForm').onsubmit = function (e) {
    e.preventDefault();
    var username = document.getElementById('loginUsername').value;
    var password = document.getElementById('loginPassword').value;

    callApi('POST', '/api/login', { username: username, password: password }).then(function (data) {
      currentUser = data.user;
      drawNavbar();
      showMessage('Welcome back, ' + data.user.username + '!', 'success');
      if (currentUser.role === 'instructor' && currentUser.status !== 'approved') {
        goTo('#/instructor/pending');
      } else {
        goTo('#/');
      }
    });
  };
}

function showRegisterPage() {
  setContent(
    '<div class="box" style="max-width:400px;">' +
    '<h1>Sign Up</h1>' +
    '<form id="registerForm">' +
    '<label>Username</label>' +
    '<input type="text" id="regUsername" required>' +
    '<label>Password</label>' +
    '<input type="password" id="regPassword" required>' +
    '<label>Confirm Password</label>' +
    '<input type="password" id="regConfirm" required>' +
    '<label>I am a:</label><br>' +
    '<input type="radio" name="role" value="student" checked style="width:auto;display:inline-block;margin-right:6px;"> Student &nbsp;' +
    '<input type="radio" name="role" value="instructor" style="width:auto;display:inline-block;margin-right:6px;"> Instructor' +
    '<p style="font-size:13px;color:var(--ink-soft);margin-top:10px;">Note: instructor accounts need admin approval before you can log in.</p>' +
    '<button type="submit" class="btn btn-blue">Sign Up</button>' +
    '</form>' +
    '<p>Already have an account? <a onclick="goTo(\'#/login\')">Login</a></p>' +
    '</div>'
  );

  document.getElementById('registerForm').onsubmit = function (e) {
    e.preventDefault();
    var role = document.querySelector('input[name=role]:checked').value;
    callApi('POST', '/api/register', {
      username: document.getElementById('regUsername').value,
      password: document.getElementById('regPassword').value,
      confirm_password: document.getElementById('regConfirm').value,
      role: role
    }).then(function (data) {
      showMessage(data.message, 'success');
      goTo('#/login');
    });
  };
}

function showPendingPage() {
  var rejected = currentUser.status === 'rejected';
  setContent(
    '<div class="box center">' +
    '<h1>' + (rejected ? 'Account Rejected' : 'Waiting for Approval') + '</h1>' +
    '<p>' + (rejected ?
      'Your instructor account was rejected. Please contact the admin.' :
      'An admin needs to approve your instructor account before you can create quizzes.') + '</p>' +
    '<a class="btn btn-gray" onclick="logout()">Logout</a>' +
    '</div>'
  );
}

// ===================================================
// ADMIN PAGES
// ===================================================

function showAdminDashboard() {
  callApi('GET', '/api/admin/stats').then(function (s) {
    setContent(
      '<div class="box">' +
      '<h1>Admin Dashboard</h1>' +
      '<p>Pending instructors: <b>' + s.pending_count + '</b></p>' +
      '<p>Approved instructors: <b>' + s.instructor_count + '</b></p>' +
      '<p>Students: <b>' + s.student_count + '</b></p>' +
      '<p>Quizzes: <b>' + s.quiz_count + '</b></p>' +
      '<p>Quiz attempts: <b>' + s.attempt_count + '</b></p>' +
      '<a class="btn btn-blue" onclick="goTo(\'#/admin/instructors\')">Manage Instructors</a>' +
      '<a class="btn btn-blue" onclick="goTo(\'#/admin/quizzes\')">View Quizzes</a>' +
      '<a class="btn btn-blue" onclick="goTo(\'#/admin/results\')">View Results</a>' +
      '</div>'
    );
  });
}

function showAdminInstructors() {
  callApi('GET', '/api/admin/instructors').then(function (data) {
    var rows = '';
    data.instructors.forEach(function (i) {
      var actionButtons = '';
      if (i.status === 'pending') {
        actionButtons = '<button class="btn btn-green" onclick="approveInstructor(' + i.id + ')">Approve</button>' +
                         '<button class="btn btn-red" onclick="rejectInstructor(' + i.id + ')">Reject</button>';
      } else if (i.status === 'approved') {
        actionButtons = '<button class="btn btn-red" onclick="rejectInstructor(' + i.id + ')">Revoke</button>';
      } else {
        actionButtons = '<button class="btn btn-green" onclick="approveInstructor(' + i.id + ')">Approve</button>';
      }
      rows += '<tr><td>' + esc(i.username) + '</td>' +
              '<td><span class="tag tag-' + i.status + '">' + i.status + '</span></td>' +
              '<td>' + i.quiz_count + '</td>' +
              '<td>' + i.created_at + '</td>' +
              '<td>' + actionButtons + '</td></tr>';
    });

    setContent(
      '<div class="box">' +
      '<h1>Instructors</h1>' +
      (data.instructors.length ?
        '<table><tr><th>Username</th><th>Status</th><th>Quizzes</th><th>Registered</th><th>Action</th></tr>' + rows + '</table>' :
        '<p>No instructors have registered yet.</p>') +
      '</div>'
    );
  });
}

    showAdminInstructors();

function rejectInstructor(id) {

    showMessage('Instructor rejected.', 'info');
    showAdminInstructors();
  });
}

              '<td>' + (r.time_taken_seconds != null ? r.time_taken_seconds + 's' : '-') + '</td>' +

// ===================================================
// INSTRUCTOR PAGES
// ===================================================

function showInstructorDashboard() {
  callApi('GET', '/api/instructor/quizzes').then(function (data) {
    var boxes = '';
    data.quizzes.forEach(function (q) {
      boxes += '<div class="quiz-box">' +
               '<h3>' + esc(q.title) + '</h3>' +
               '<p>' + esc(q.description || 'No description') + '</p>' +
               '<p>Questions: ' + q.question_count + ' | Timer: ' + (q.time_limit_minutes ? q.time_limit_minutes + ' min' : 'none') + '</p>' +
               '<button class="btn btn-blue" onclick="goTo(\'#/instructor/questions/' + q.id + '\')">Questions</button>' +
               '<button class="btn btn-gray" onclick="goTo(\'#/instructor/edit/' + q.id + '\')">Edit</button>' +
               '<button class="btn btn-gray" onclick="goTo(\'#/instructor/leaderboard/' + q.id + '\')">Leaderboard</button>' +
               '<button class="btn btn-red" onclick="deleteMyQuiz(' + q.id + ')">Delete</button>' +
               '</div>';
    });
    setContent(
      '<div class="box"><h1>My Quizzes</h1>' +
      '<a class="btn btn-blue" onclick="goTo(\'#/instructor/new\')">+ New Quiz</a>' +
      '<div class="grid" style="margin-top:15px;">' + (boxes || '<p>You have not made any quizzes yet.</p>') + '</div>' +
      '</div>'
    );

}

function deleteMyQuiz(id) {
  if (!confirm('Delete this quiz and all its questions/results?')) return;
  callApi('DELETE', '/api/instructor/quizzes/' + id).then(function () {
    showMessage('Quiz deleted.', 'info');
    showInstructorDashboard();
  });
}

function showQuizForm(quizId) {
  // if editing, we first need to fetch the quiz's current info
  var loadQuiz = quizId ? callApi('GET', '/api/instructor/quizzes/' + quizId + '/questions') : Promise.resolve(null);

  loadQuiz.then(function (data) {
    var quiz = data ? data.quiz : null;

    setContent(
      '<div class="box" style="max-width:500px;">' +
      '<h1>' + (quiz ? 'Edit Quiz' : 'New Quiz') + '</h1>' +
      '<form id="quizForm">' +
      '<label>Title</label>' +
      '<input type="text" id="quizTitle" value="' + (quiz ? esc(quiz.title) : '') + '" required>' +
      '<label>Description</label>' +
      '<textarea id="quizDesc">' + (quiz ? esc(quiz.description || '') : '') + '</textarea>' +
      '<label>Time Limit in minutes (leave blank for no timer)</label>' +
      '<input type="number" id="quizTimer" min="1" value="' + (quiz && quiz.time_limit_minutes ? quiz.time_limit_minutes : '') + '">' +
      '<button type="submit" class="btn btn-blue">' + (quiz ? 'Save' : 'Create') + '</button>' +
      '<button type="button" class="btn btn-gray" onclick="goTo(\'#/instructor\')">Cancel</button>' +
      '</form>' +
      '</div>'
    );

    document.getElementById('quizForm').onsubmit = function (e) {
      e.preventDefault();
      var payload = {
        title: document.getElementById('quizTitle').value,
        description: document.getElementById('quizDesc').value,
        time_limit_minutes: document.getElementById('quizTimer').value
      };
      if (quiz) {
        callApi('PUT', '/api/instructor/quizzes/' + quizId, payload).then(function () {
          showMessage('Quiz updated.', 'success');
          goTo('#/instructor/questions/' + quizId);
        });
      } else {
        callApi('POST', '/api/instructor/quizzes', payload).then(function (res) {
          showMessage('Quiz created. Now add some questions.', 'success');
          goTo('#/instructor/questions/' + res.quiz_id);
        });
      }
    };
  });
}

function showQuestionsPage(quizId) {
  callApi('GET', '/api/instructor/quizzes/' + quizId + '/questions').then(function (data) {
    var quiz = data.quiz;
    var qHtml = '';
    data.questions.forEach(function (q, index) {
      qHtml += '<div class="question">' +
               '<b>Q' + (index + 1) + '.</b> ' + esc(q.question_text) +
               ' <button class="btn btn-red" style="float:right;" onclick="deleteQuestion(' + q.id + ',' + quizId + ')">Delete</button>' +
               '<div class="option">A. ' + esc(q.option_a) + (q.correct_option === 'A' ? ' &#10003; correct' : '') + '</div>' +
               '<div class="option">B. ' + esc(q.option_b) + (q.correct_option === 'B' ? ' &#10003; correct' : '') + '</div>' +
               '<div class="option">C. ' + esc(q.option_c) + (q.correct_option === 'C' ? ' &#10003; correct' : '') + '</div>' +
               '<div class="option">D. ' + esc(q.option_d) + (q.correct_option === 'D' ? ' &#10003; correct' : '') + '</div>' +
               '</div>';
    });

    setContent(
      '<div class="box">' +
      '<h1>' + esc(quiz.title) + '</h1>' +
      '<p>' + esc(quiz.description || '') + '</p>' +
      (quiz.time_limit_minutes ? '<p>Timer: ' + quiz.time_limit_minutes + ' minutes</p>' : '') +
      '<a class="btn btn-blue" onclick="goTo(\'#/instructor/addquestion/' + quizId + '\')">+ Add Question</a>' +
      '<a class="btn btn-gray" onclick="goTo(\'#/instructor/upload/' + quizId + '\')">Upload CSV</a>' +
      '<div style="margin-top:15px;">' + (qHtml || '<p>No questions yet.</p>') + '</div>' +
      '<a onclick="goTo(\'#/instructor\')">&laquo; Back to My Quizzes</a>' +
      '</div>'
    );
  });
}

function deleteQuestion(questionId, quizId) {
  if (!confirm('Delete this question?')) return;
  callApi('DELETE', '/api/instructor/questions/' + questionId).then(function () {
    showMessage('Question deleted.', 'info');
    showQuestionsPage(quizId);
  });
}

function showAddQuestionPage(quizId) {
  setContent(
    '<div class="box" style="max-width:500px;">' +
    '<h1>Add Question</h1>' +
    '<form id="questionForm">' +
    '<label>Question</label>' +
    '<textarea id="qText" required></textarea>' +
    '<label>Option A</label><input type="text" id="qA" required>' +
    '<label>Option B</label><input type="text" id="qB" required>' +
    '<label>Option C</label><input type="text" id="qC" required>' +
    '<label>Option D</label><input type="text" id="qD" required>' +
    '<label>Correct Option</label>' +
    '<select id="qCorrect"><option>A</option><option>B</option><option>C</option><option>D</option></select>' +
    '<button type="submit" class="btn btn-blue">Add</button>' +
    '<button type="button" class="btn btn-gray" onclick="goTo(\'#/instructor/questions/' + quizId + '\')">Done</button>' +
    '</form>' +
    '</div>'
  );

  document.getElementById('questionForm').onsubmit = function (e) {
    e.preventDefault();
    callApi('POST', '/api/instructor/quizzes/' + quizId + '/questions', {
      question_text: document.getElementById('qText').value,
      option_a: document.getElementById('qA').value,
      option_b: document.getElementById('qB').value,
      option_c: document.getElementById('qC').value,
      option_d: document.getElementById('qD').value,
      correct_option: document.getElementById('qCorrect').value
    }).then(function () {
      showMessage('Question added.', 'success');
      goTo('#/instructor/questions/' + quizId);
    });
  };
}

function showUploadPage(quizId) {
  setContent(
    '<div class="box" style="max-width:500px;">' +
    '<h1>Upload Questions (CSV)</h1>' +
    '<form id="uploadForm">' +
    '<input type="file" id="csvFile" accept=".csv" required>' +
    '<button type="submit" class="btn btn-blue">Upload</button>' +
    '</form>' +
    '<p style="font-size:13px; margin-top:15px;">The CSV needs these exact column headers:</p>' +
    '<p style="font-family:monospace; background:var(--sky-light); color:var(--sky-dark); padding:10px; border-radius:6px; font-size:12px;">' +
    'question_text,option_a,option_b,option_c,option_d,correct_option</p>' +
    '<p style="font-size:13px;">correct_option should be A, B, C, or D.</p>' +
    '<a onclick="goTo(\'#/instructor/questions/' + quizId + '\')">&laquo; Back</a>' +
    '</div>'
  );

  document.getElementById('uploadForm').onsubmit = function (e) {
    e.preventDefault();
    var fileInput = document.getElementById('csvFile');
    if (!fileInput.files.length) return;
    var formData = new FormData();
    formData.append('csv_file', fileInput.files[0]);
    callApi('POST', '/api/instructor/quizzes/' + quizId + '/questions/upload', formData, true).then(function (res) {
      showMessage(res.message, 'success');
      if (res.errors && res.errors.length) {
        showMessage(res.errors.length + ' rows skipped. ' + res.errors.slice(0, 3).join(' | '), 'warning');
      }
      goTo('#/instructor/questions/' + quizId);
    });
  };
}

// ===================================================
// LEADERBOARD (used by instructor, student, and admin views)
// ===================================================

function showLeaderboard(quizId, url) {
  callApi('GET', url).then(function (data) {
    var title = data.quiz ? data.quiz.title : 'Quiz';
    var myId = currentUser ? currentUser.id : null;
    var rows = '';
    data.leaderboard.forEach(function (row) {
      var pct = ((row.score / row.total_questions) * 100).toFixed(1);
      var isMe = myId && row.user_id === myId;
      rows += '<tr class="' + (isMe ? 'highlight' : '') + '">' +
              '<td>#' + row.rank + '</td>' +
              '<td>' + esc(row.username) + (isMe ? ' (you)' : '') + '</td>' +
              '<td>' + row.score + '/' + row.total_questions + '</td>' +
              '<td>' + pct + '%</td>' +
              '<td>' + (row.time_taken_seconds != null ? row.time_taken_seconds + 's' : '-') + '</td>' +
              '<td>' + (row.taken_at || '') + '</td></tr>';
    });

    setContent(
      '<div class="box"><h1>Leaderboard &mdash; ' + esc(title) + '</h1>' +
      (data.leaderboard.length ?
        '<table><tr><th>Rank</th><th>Student</th><th>Score</th><th>%</th><th>Time</th><th>Date</th></tr>' + rows + '</table>' :
        '<p>No one has taken this quiz yet.</p>') +
      '</div>'
    );
  });
}

function showStudentDashboard() {
  callApi('GET', '/api/student/quizzes').then(function (data) {
    var boxes = '';
    data.quizzes.forEach(function (q) {
      boxes += '<div class="quiz-box">' +
               '<h3>' + esc(q.title) + (q.is_default ? ' <span class="tag tag-approved">default</span>' : '') + '</h3>' +
               '<p>' + esc(q.description || 'No description') + '</p>' +
               '<p>Questions: ' + q.question_count + (q.time_limit_minutes ? ' | Timer: ' + q.time_limit_minutes + ' min' : '') + '</p>' +
               (q.taken ?
                 '<span class="tag tag-approved">Completed</span> <button class="btn btn-gray" onclick="goTo(\'#/student/take/' + q.id + '\')">Retake</button>' :
                 '<button class="btn btn-blue" onclick="goTo(\'#/student/take/' + q.id + '\')">Start Quiz</button>') +
               ' <button class="btn btn-gray" onclick="goTo(\'#/leaderboard/' + q.id + '\')">Leaderboard</button>' +
               '</div>';
    });
    setContent('<div class="box"><h1>Available Quizzes</h1><div class="grid">' + (boxes || '<p>No quizzes available right now.</p>') + '</div></div>');
  });
}

function showTakeQuizPage(quizId) {
  callApi('GET', '/api/student/quizzes/' + quizId).then(function (data) {
    var quiz = data.quiz;
    var questions = data.questions;

    var qHtml = '';
    questions.forEach(function (q, index) {
      qHtml += '<div class="question">' +
               '<b>Q' + (index + 1) + '.</b> ' + esc(q.question_text) +
               '<div class="option"><label><input type="radio" name="q' + q.id + '" value="A" style="width:auto;display:inline;margin-right:6px;"> A. ' + esc(q.option_a) + '</label></div>' +
               '<div class="option"><label><input type="radio" name="q' + q.id + '" value="B" style="width:auto;display:inline;margin-right:6px;"> B. ' + esc(q.option_b) + '</label></div>' +
               '<div class="option"><label><input type="radio" name="q' + q.id + '" value="C" style="width:auto;display:inline;margin-right:6px;"> C. ' + esc(q.option_c) + '</label></div>' +
               '<div class="option"><label><input type="radio" name="q' + q.id + '" value="D" style="width:auto;display:inline;margin-right:6px;"> D. ' + esc(q.option_d) + '</label></div>' +
               '</div>';
    });

    setContent(
      '<div class="box">' +
      (quiz.time_limit_minutes ? '<div class="timer">Time left: <span id="timeLeft">' + quiz.time_limit_minutes + ':00</span></div>' : '') +
      '<h1>' + esc(quiz.title) + '</h1>' +
      '<form id="takeForm">' + qHtml + '<button type="submit" class="btn btn-blue">Submit Quiz</button></form>' +
      '</div>'
    );

    var startTime = Date.now();
    var alreadySubmitted = false;

    function submitQuiz() {
      if (alreadySubmitted) return;
      alreadySubmitted = true;
      var answers = {};
      questions.forEach(function (q) {
        var picked = document.querySelector('input[name=q' + q.id + ']:checked');
        if (picked) answers[q.id] = picked.value;
      });
      var timeTaken = Math.floor((Date.now() - startTime) / 1000);
      callApi('POST', '/api/student/quizzes/' + quizId + '/submit', { answers: answers, time_taken_seconds: timeTaken })
        .then(function (result) {
          showResultPage(quiz, result);
        })
        .catch(function () { alreadySubmitted = false; });
    }

    document.getElementById('takeForm').onsubmit = function (e) {
      e.preventDefault();
      submitQuiz();
    };

    if (quiz.time_limit_minutes) {
      var secondsLeft = quiz.time_limit_minutes * 60;
      var timeLeftEl = document.getElementById('timeLeft');
      var timer = setInterval(function () {
        secondsLeft--;
        if (secondsLeft <= 0) {
          clearInterval(timer);
          timeLeftEl.textContent = '0:00';
          submitQuiz();
          return;
        }
        var mins = Math.floor(secondsLeft / 60);
        var secs = secondsLeft % 60;
        timeLeftEl.textContent = mins + ':' + (secs < 10 ? '0' : '') + secs;
      }, 1000);
    }
  });
}

function showResultPage(quiz, result) {
  setContent(
    '<div class="box center">' +
    '<h1>' + esc(quiz.title) + '</h1>' +
    '<div class="score-box">' + result.score + '/' + result.total + '</div>' +
    '<p>You scored ' + result.percentage + '%</p>' +
    (result.rank ? '<p>Your rank: #' + result.rank + ' out of ' + result.total_participants + '</p>' : '') +
    '<button class="btn btn-blue" onclick="goTo(\'#/student\')">Back to Quizzes</button>' +
    '<button class="btn btn-gray" onclick="goTo(\'#/leaderboard/' + quiz.id + '\')">View Leaderboard</button>' +
    '</div>'
  );
}

function showMyResults() {
  callApi('GET', '/api/student/results').then(function (data) {
    var rows = '';
    data.results.forEach(function (r) {
      var pct = ((r.score / r.total_questions) * 100).toFixed(1);
      rows += '<tr><td>' + esc(r.quiz_title) + '</td><td>' + r.score + '/' + r.total_questions + '</td>' +
              '<td>' + pct + '%</td><td>' + (r.time_taken_seconds != null ? r.time_taken_seconds + 's' : '-') + '</td>' +
              '<td>' + r.taken_at + '</td>' +
              '<td><a onclick="goTo(\'#/leaderboard/' + r.quiz_id + '\')">View</a></td></tr>';
    });
    setContent(
      '<div class="box"><h1>My Results</h1>' +
      (data.results.length ?
        '<table><tr><th>Quiz</th><th>Score</th><th>%</th><th>Time</th><th>Date</th><th>Leaderboard</th></tr>' + rows + '</table>' :
        '<p>You have not taken any quizzes yet.</p>') +
      '</div>'
    );
  });
}
